<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Verify - Cash Rich</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --accent:#10b981; --green:#22c55e; --red:#ef4444; --bg:#050e0a; --bg2:#0a1a12;
    --card:#0f2419; --border:rgba(255,255,255,.08); --text:#f2f1f7; --muted:#8ea79a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 50% -10%, var(--bg2), var(--bg) 70%);
    color:var(--text); min-height:100vh; position:relative; overflow-x:hidden;
    display:flex; flex-direction:column;
  }

  .deco-dot{position:fixed; border-radius:50%; background:#3d3a5c; opacity:.35; z-index:0;}

  .topbar{
    position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; border-bottom:1px solid var(--border);
  }
  .topbar-left{display:flex; align-items:center; gap:12px;}
  .avatar{
    width:46px; height:46px; border-radius:50%; object-fit:cover; flex-shrink:0;
    background:linear-gradient(135deg,#c026d3,#7c3aed); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; color:#fff;
  }
  .topbar-info{display:flex; flex-direction:column;}
  .topbar-name{font-size:16px; font-weight:800; color:#fff; letter-spacing:.2px;}
  .topbar-id{font-size:12px; color:var(--muted); margin-top:1px;}
  .status-pill{
    display:flex; align-items:center; gap:7px; padding:7px 16px; border-radius:100px;
    font-size:12px; font-weight:800; letter-spacing:.4px; border:1px solid;
    background:rgba(124,111,255,.12); color:var(--accent); border-color:rgba(124,111,255,.35);
    transition:all .3s ease;
  }
  .status-pill .dot{width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulseDot 1.2s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1} 50%{opacity:.3}}
  .status-pill.fail{background:rgba(239,68,68,.12); color:var(--red); border-color:rgba(239,68,68,.35);}
  .status-pill.ok{background:rgba(34,197,94,.12); color:var(--green); border-color:rgba(34,197,94,.35);}

  .main{position:relative; z-index:2; flex:1; display:flex; align-items:center; justify-content:center; padding:40px 22px;}
  .card{
    width:100%; max-width:340px; background:var(--card); border:1px solid var(--border); border-radius:24px;
    padding:44px 28px 36px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5);
    animation:cardIn .55s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)}}

  .ring-wrap{position:relative; width:150px; height:150px; margin:0 auto 8px;}
  .ring-shadow{
    position:absolute; bottom:-14px; left:50%; transform:translateX(-50%); width:90px; height:18px;
    background:radial-gradient(ellipse, rgba(124,111,255,.35), transparent 70%); filter:blur(4px);
  }
  .ring-spin{
    position:absolute; inset:0; animation:ringSpin 1.6s linear infinite, ringHue 3.2s linear infinite;
    transform-origin:50% 50%;
  }
  @keyframes ringSpin{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes ringHue{ from{filter:hue-rotate(0deg)} to{filter:hue-rotate(360deg)} }
  .ring-svg{width:150px; height:150px;}
  .ring-arc{fill:none; stroke-linecap:round;}

  h2{font-size:21px; font-weight:800; margin:26px 0 8px; color:var(--accent); letter-spacing:.2px;}
  h2.fail{color:var(--red);}
  h2.ok{color:var(--green);}
  p.sub{font-size:13.5px; color:var(--muted); line-height:1.5; margin:0 0 28px;}

  .progress-track{width:100%; height:9px; background:rgba(255,255,255,.06); border-radius:20px; overflow:hidden;}
  .progress-fill{
    height:100%; width:0%; border-radius:20px; background:linear-gradient(90deg,var(--accent),#facc15);
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }

  .status-icon{
    width:96px; height:96px; border-radius:50%; border:2px solid; display:flex; align-items:center; justify-content:center;
    margin:0 auto;
  }
  .status-icon.fail{border-color:var(--red); box-shadow:0 0 30px rgba(239,68,68,.25);}
  .status-icon.ok{border-color:var(--green); box-shadow:0 0 30px rgba(34,197,94,.25);}
  .status-icon svg{width:44px; height:44px;}

  .ban-btn{
    display:block; width:100%; margin-top:26px; padding:16px; border-radius:14px; border:none;
    background:linear-gradient(90deg,var(--red),#f87171); color:#fff; font-weight:800; font-size:14.5px;
    letter-spacing:.4px; text-align:center; box-shadow:0 10px 24px rgba(239,68,68,.3); text-transform:uppercase;
  }

  .footer{position:relative; z-index:2; text-align:center; font-size:11.5px; color:var(--muted); padding:16px 0 22px;}
  .footer a{color:var(--accent); text-decoration:none; font-weight:700;}

  .confetti-wrap{position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden;}
  .confetti{position:absolute; top:-10px; width:7px; height:7px; opacity:.9; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(500deg); opacity:.2;}}

  .fade{animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <img class="avatar" id="avatarImg" src="" alt="" style="display:none;" />
    <div class="avatar" id="avatarFallback">?</div>
    <div class="topbar-info">
      <div class="topbar-name" id="topbarName">User</div>
      <div class="topbar-id" id="topbarId">ID: —</div>
    </div>
  </div>
  <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusPillText">SCANNING</span></div>
</div>

<div class="main">
  <div class="card">

    <div id="scanState">
      <div class="ring-wrap">
        <div class="ring-shadow"></div>
        <div class="ring-spin">
          <svg class="ring-svg" viewBox="0 0 150 150">
            <defs>
              <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ef4444"/>
                <stop offset="16%" stop-color="#f97316"/>
                <stop offset="33%" stop-color="#facc15"/>
                <stop offset="50%" stop-color="#22c55e"/>
                <stop offset="66%" stop-color="#06b6d4"/>
                <stop offset="83%" stop-color="#7c3aed"/>
                <stop offset="100%" stop-color="#ef4444"/>
              </linearGradient>
            </defs>
            <circle class="ring-arc" cx="75" cy="75" r="64" stroke="url(#rainbowGrad)" stroke-width="6" stroke-dasharray="260 400" transform="rotate(-90 75 75)"></circle>
          </svg>
        </div>
      </div>

      <h2 id="title">Device Verification</h2>
      <p class="sub" id="sub">Completing authorization...</p>

      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div id="resultState" style="display:none;"></div>

  </div>
</div>

<div class="footer">© 2026 Ravi | Design by <a href="https://t.me/MAKERBOTRAVIII" target="_blank">@MAKERBOTRAVIII</a></div>

<div class="confetti-wrap" id="confettiWrap"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.expand();
tg?.ready();

const params = new URLSearchParams(window.location.search);
const tgUser = tg?.initDataUnsafe?.user;
const telegramId = params.get("uid") || String(tgUser?.id || "");
const chatId = params.get("cid") || "";
const messageId = params.get("mid") || "";

function renderIdentity() {
  const name = tgUser?.first_name || tgUser?.username || "User";
  document.getElementById("topbarName").textContent = name;
  document.getElementById("topbarId").textContent = `ID: ${telegramId}`;
  if (tgUser?.photo_url) {
    const img = document.getElementById("avatarImg");
    img.src = tgUser.photo_url;
    img.style.display = "block";
    document.getElementById("avatarFallback").style.display = "none";
  } else {
    document.getElementById("avatarFallback").textContent = name.slice(0, 2).toUpperCase();
  }
}
renderIdentity();

(function scatterDots() {
  const positions = [
    { top: "12%", left: "18%", size: 8 },
    { top: "8%", left: "82%", size: 6 },
    { top: "34%", left: "6%", size: 5 },
    { top: "70%", left: "90%", size: 7 },
    { top: "88%", left: "12%", size: 6 },
  ];
  positions.forEach(p => {
    const d = document.createElement("div");
    d.className = "deco-dot";
    d.style.top = p.top; d.style.left = p.left;
    d.style.width = p.size + "px"; d.style.height = p.size + "px";
    document.body.appendChild(d);
  });
})();

function setStatusPill(text, mode) {
  const pill = document.getElementById("statusPill");
  pill.classList.remove("fail", "ok");
  if (mode) pill.classList.add(mode);
  document.getElementById("statusPillText").textContent = text;
}

function runChecks() {
  const hasTelegramContext = !!tgUser || !!telegramId;
  const isHeadless = navigator.webdriver === true;
  const hasNormalUA = navigator.userAgent && navigator.userAgent.length > 10;
  const hasValidPlatform = !!tg?.platform || hasNormalUA;
  return hasTelegramContext && !isHeadless && hasNormalUA && hasValidPlatform;
}

async function buildFingerprint() {
  const raw = [
    navigator.userAgent, navigator.platform, navigator.language,
    navigator.hardwareConcurrency || "", screen.width + "x" + screen.height + "x" + screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone || "", tg?.platform || "",
  ].join("|");
  try {
    const encoder = new TextEncoder();
    const data = encoder.encode(raw);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    let h = 0;
    for (let i = 0; i < raw.length; i++) { h = (h * 31 + raw.charCodeAt(i)) | 0; }
    return "fallback-" + Math.abs(h).toString(16);
  }
}

function launchConfetti() {
  const colors = ["#22c55e", "#10b981", "#facc15", "#4ade80"];
  const wrap = document.getElementById("confettiWrap");
  for (let i = 0; i < 42; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.8 + Math.random() * 1.3) + "s";
    wrap.appendChild(c);
    setTimeout(() => c.remove(), 3400);
  }
}

async function verify() {
  setStatusPill("SCANNING", null);
  document.getElementById("progressFill").style.width = "15%";
  await new Promise(r => setTimeout(r, 500));
  const fingerprint = await buildFingerprint();

  document.getElementById("progressFill").style.width = "40%";
  await new Promise(r => setTimeout(r, 500));

  document.getElementById("progressFill").style.width = "65%";
  const passed = runChecks();
  await new Promise(r => setTimeout(r, 500));

  document.getElementById("progressFill").style.width = "88%";
  await new Promise(r => setTimeout(r, 450));

  document.getElementById("progressFill").style.width = "100%";
  await new Promise(r => setTimeout(r, 350));

  const res = await fetch("/api/verify", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ telegramId, passed, fingerprint, chatId, messageId }),
  });
  const data = await res.json();

  document.getElementById("scanState").style.display = "none";
  const resultState = document.getElementById("resultState");
  resultState.style.display = "block";
  resultState.classList.add("fade");

  if (data.verified) {
    setStatusPill("VERIFIED", "ok");
    resultState.innerHTML = `
      <div class="status-icon ok">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2 class="ok">Verified!</h2>
      <p class="sub">Aap verify ho gaye! Bot me wapas jaake Mini App open karo.</p>
    `;
    launchConfetti();
    setTimeout(() => tg?.close?.(), 2000);
  } else {
    setStatusPill("FAILED", "fail");
    resultState.innerHTML = `
      <div class="status-icon fail">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4"></path>
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <path d="M12 17h.01"></path>
        </svg>
      </div>
      <h2 class="fail">Verification Failed</h2>
      <p class="sub">Suspicious activity detect hui.</p>
      <div class="ban-btn">⛔ Banned — Contact Admin</div>
    `;
  }
}

verify();
</script>
</body>
</html>
