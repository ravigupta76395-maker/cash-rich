<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Verify - Cash Rich</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#ffffff; --bg2:#fff8ea;
    --gold:#f59e0b; --gold2:#fbbf24;
    --purple:#7c3aed; --purple2:#a855f7;
    --green:#16a34a; --green2:#22c55e;
    --red:#ef4444;
    --card:#ffffff; --card2:#fffaf0;
    --border:rgba(15,23,42,.08); --text:#181322; --muted:#78748c;
    --shadow:0 18px 44px -18px rgba(15,23,42,.18);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(circle at 12% -6%, rgba(245,158,11,.16), transparent 42%),
      radial-gradient(circle at 90% 105%, rgba(124,58,237,.14), transparent 48%),
      var(--bg);
    color:var(--text); min-height:100vh; position:relative; overflow-x:hidden;
    display:flex; flex-direction:column;
    animation:bodyFade .5s var(--ease) both;
  }
  @keyframes bodyFade{ from{opacity:0} to{opacity:1} }

  .deco-dot{position:fixed; border-radius:50%; background:rgba(245,158,11,.08); opacity:.6; z-index:0;}

  .topbar{
    position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; border-bottom:1px solid var(--border);
    animation:fadeDown .5s var(--ease) both;
  }
  @keyframes fadeDown{ from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:translateY(0)} }
  .topbar-left{display:flex; align-items:center; gap:12px;}
  .avatar{
    width:46px; height:46px; border-radius:50%; object-fit:cover; flex-shrink:0;
    background:linear-gradient(135deg,var(--gold2),var(--gold)); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; color:#fff; box-shadow:0 8px 18px -6px rgba(245,158,11,.5);
  }
  .topbar-info{display:flex; flex-direction:column;}
  .topbar-name{font-size:16px; font-weight:800; letter-spacing:.2px;}
  .topbar-id{font-size:12px; color:var(--muted); margin-top:1px;}
  .status-pill{
    display:flex; align-items:center; gap:7px; padding:7px 16px; border-radius:100px;
    font-size:12px; font-weight:800; letter-spacing:.4px; border:1px solid;
    background:rgba(124,58,237,.08); color:var(--purple); border-color:rgba(124,58,237,.25);
    transition:all .3s var(--ease);
  }
  .status-pill .dot{width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulseDot 1.2s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1} 50%{opacity:.3}}
  .status-pill.fail{background:rgba(239,68,68,.1); color:var(--red); border-color:rgba(239,68,68,.3);}
  .status-pill.ok{background:rgba(34,197,94,.1); color:var(--green); border-color:rgba(34,197,94,.3);}

  .main{position:relative; z-index:2; flex:1; display:flex; align-items:center; justify-content:center; padding:40px 22px;}
  .card{
    width:100%; max-width:340px; background:linear-gradient(155deg,var(--card),var(--card2));
    border:1px solid var(--border); border-radius:24px;
    padding:44px 28px 36px; text-align:center; box-shadow:var(--shadow);
    animation:cardIn .55s var(--ease) both;
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(20px) scale(.98)} to{opacity:1; transform:translateY(0) scale(1)}}

  .ring-wrap{position:relative; width:150px; height:150px; margin:0 auto 8px;}
  .ring-shadow{
    position:absolute; bottom:-14px; left:50%; transform:translateX(-50%); width:90px; height:18px;
    background:radial-gradient(ellipse, rgba(245,158,11,.3), transparent 70%); filter:blur(4px);
  }
  .ring-spin{
    position:absolute; inset:0; animation:ringSpin 1.6s linear infinite, ringHue 3.2s linear infinite;
    transform-origin:50% 50%;
  }
  @keyframes ringSpin{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes ringHue{ from{filter:hue-rotate(0deg)} to{filter:hue-rotate(360deg)} }
  .ring-svg{width:150px; height:150px;}
  .ring-arc{fill:none; stroke-linecap:round;}

  h2{font-size:21px; font-weight:800; margin:26px 0 8px; letter-spacing:.2px;
    background:linear-gradient(135deg,var(--gold),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  h2.fail{background:none; -webkit-text-fill-color:initial; color:var(--red);}
  h2.ok{background:none; -webkit-text-fill-color:initial; color:var(--green);}
  p.sub{font-size:13.5px; color:var(--muted); line-height:1.5; margin:0 0 28px;}

  .progress-track{width:100%; height:9px; background:var(--bg2); border-radius:20px; overflow:hidden; border:1px solid var(--border);}
  .progress-fill{
    height:100%; width:0%; border-radius:20px; background:linear-gradient(90deg,var(--purple2),var(--gold));
    transition:width .5s var(--ease);
  }

  .status-icon{
    width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    margin:0 auto; animation:popIn .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes popIn{ from{transform:scale(.5); opacity:0} to{transform:scale(1); opacity:1} }
  .status-icon.fail{background:linear-gradient(135deg,#f87171,var(--red)); box-shadow:0 14px 30px -10px rgba(239,68,68,.5);}
  .status-icon.ok{background:linear-gradient(135deg,var(--green2),var(--green)); box-shadow:0 14px 30px -10px rgba(34,197,94,.5);}
  .status-icon svg{width:44px; height:44px;}

  .ban-btn{
    display:block; width:100%; margin-top:26px; padding:16px; border-radius:14px; border:none;
    background:linear-gradient(135deg,#f87171,var(--red)); color:#fff; font-weight:800; font-size:14.5px;
    letter-spacing:.4px; text-align:center; box-shadow:0 12px 26px -10px rgba(239,68,68,.5); text-transform:uppercase;
    transition:transform .16s var(--ease);
  }
  .ban-btn:active{ transform:scale(.97); }

  .footer{position:relative; z-index:2; text-align:center; font-size:11.5px; color:#c9c4dc; padding:16px 0 22px;}
  .footer a{color:var(--purple2); text-decoration:none; font-weight:700;}

  .confetti-wrap{position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden;}
  .confetti{position:absolute; top:-10px; width:7px; height:7px; opacity:.9; animation:fall linear forwards; border-radius:2px;}
  @keyframes fall{to{transform:translateY(110vh) rotate(500deg); opacity:.2;}}

  .fade{animation:fadeUp .4s var(--ease) both;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <img class="avatar" id="avatarImg" src="" alt="" style="display:none;" />
    <div class="avatar" id="avatarFallback">?</div>
    <div class="topbar-info">
      <div class="topbar-name" id="topbarName">User</div>
      <div class="topbar-id" id="topbarId">ID: —</div>
    </div>
  </div>
  <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusPillText">SCANNING</span></div>
</div>

<div class="main">
  <div class="card">

    <div id="scanState">
      <div class="ring-wrap">
        <div class="ring-shadow"></div>
        <div class="ring-spin">
          <svg class="ring-svg" viewBox="0 0 150 150">
            <defs>
              <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ef4444"/>
                <stop offset="16%" stop-color="#f97316"/>
                <stop offset="33%" stop-color="#facc15"/>
                <stop offset="50%" stop-color="#22c55e"/>
                <stop offset="66%" stop-color="#06b6d4"/>
                <stop offset="83%" stop-color="#7c3aed"/>
                <stop offset="100%" stop-color="#ef4444"/>
              </linearGradient>
            </defs>
            <circle class="ring-arc" cx="75" cy="75" r="64" stroke="url(#rainbowGrad)" stroke-width="6" stroke-dasharray="260 400" transform="rotate(-90 75 75)"></circle>
          </svg>
        </div>
      </div>

      <h2 id="title">Device Verification</h2>
      <p class="sub" id="sub">Completing authorization...</p>

      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div id="resultState" style="display:none;"></div>

  </div>
</div>

<div class="footer">© 2026 Ravi | Design by <a href="https://t.me/MAKERBOTRAVIII" target="_blank">@MAKERBOTRAVIII</a></div>

<div class="confetti-wrap" id="confettiWrap"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.expand();
tg?.ready();

const params = new URLSearchParams(window.location.search);
const tgUser = tg?.initDataUnsafe?.user;
const telegramId = params.get("uid") || String(tgUser?.id || "");
const chatId = params.get("cid") || "";
const messageId = params.get("mid") || "";

function renderIdentity() {
  const name = tgUser?.first_name || tgUser?.username || "User";
  document.getElementById("topbarName").textContent = name;
  document.getElementById("topbarId").textContent = `ID: ${telegramId}`;
  if (tgUser?.photo_url) {
    const img = document.getElementById("avatarImg");
    img.src = tgUser.photo_url;
    img.style.display = "block";
    document.getElementById("avatarFallback").style.display = "none";
  } else {
    document.getElementById("avatarFallback").textContent = name.slice(0, 2).toUpperCase();
  }
}
renderIdentity();

(function scatterDots() {
  const positions = [
    { top: "12%", left: "18%", size: 8 },
    { top: "8%", left: "82%", size: 6 },
    { top: "34%", left: "6%", size: 5 },
    { top: "70%", left: "90%", size: 7 },
    { top: "88%", left: "12%", size: 6 },
  ];
  positions.forEach(p => {
    const d = document.createElement("div");
    d.className = "deco-dot";
    d.style.top = p.top; d.style.left = p.left;
    d.style.width = p.size + "px"; d.style.height = p.size + "px";
    document.body.appendChild(d);
  });
})();

function setStatusPill(text, mode) {
  const pill = document.getElementById("statusPill");
  pill.classList.remove("fail", "ok");
  if (mode) pill.classList.add(mode);
  document.getElementById("statusPillText").textContent = text;
}

function runChecks() {
  const hasTelegramContext = !!tgUser || !!telegramId;
  const isHeadless = navigator.webdriver === true;

  // Headless/automation frameworks commonly leave these tells even when
  // navigator.webdriver is patched out.
  const noPlugins = navigator.plugins && navigator.plugins.length === 0;
  const noLanguages = !navigator.languages || navigator.languages.length === 0;
  const suspiciousUA = /HeadlessChrome|PhantomJS|Puppeteer|Selenium/i.test(navigator.userAgent || "");
  const hasNormalUA = navigator.userAgent && navigator.userAgent.length > 10;

  // A real phone reports touch points; a real desktop reports a mouse.
  // Neither existing is a strong "this isn't a real browsing context" signal.
  const hasTouchOrPointer = navigator.maxTouchPoints > 0 || matchMedia("(pointer:fine)").matches;

  // window dimensions of 0 or a screen that doesn't match the viewport at all
  // is typical of scripted/headless browser contexts.
  const hasRealViewport = window.innerWidth > 50 && window.innerHeight > 50;

  return (
    hasTelegramContext && !isHeadless && !suspiciousUA && hasNormalUA &&
    !noPlugins && !noLanguages && hasTouchOrPointer && hasRealViewport
  );
}

// Canvas fingerprint — driven by the actual GPU/font-rendering stack, so it
// stays consistent across incognito/cleared-storage attempts on the SAME
// physical device even when the user agent string is spoofed or changed.
function buildCanvasFingerprint() {
  try {
    const canvas = document.createElement("canvas");
    canvas.width = 240; canvas.height = 60;
    const ctx = canvas.getContext("2d");
    ctx.textBaseline = "top";
    ctx.font = "16px 'Arial'";
    ctx.fillStyle = "#f59e0b";
    ctx.fillRect(0, 0, 240, 60);
    ctx.fillStyle = "#7c3aed";
    ctx.fillText("CashRich-DeviceCheck-🔒", 4, 4);
    ctx.strokeStyle = "#16a34a";
    ctx.arc(50, 30, 20, 0, Math.PI * 2);
    ctx.stroke();
    return canvas.toDataURL();
  } catch (e) {
    return "";
  }
}

// WebGL renderer/vendor strings identify the actual GPU (or software
// renderer) in use — much harder to fake convincingly than a UA string.
function buildWebglFingerprint() {
  try {
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    if (!gl) return "";
    const dbgInfo = gl.getExtension("WEBGL_debug_renderer_info");
    const vendor = dbgInfo ? gl.getParameter(dbgInfo.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    const renderer = dbgInfo ? gl.getParameter(dbgInfo.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    return `${vendor}|${renderer}|${gl.getParameter(gl.VERSION)}`;
  } catch (e) {
    return "";
  }
}

async function sha256(text) {
  try {
    const encoder = new TextEncoder();
    const data = encoder.encode(text);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    let h = 0;
    for (let i = 0; i < text.length; i++) { h = (h * 31 + text.charCodeAt(i)) | 0; }
    return "fallback-" + Math.abs(h).toString(16);
  }
}

async function buildFingerprint() {
  const raw = [
    navigator.userAgent, navigator.platform, navigator.language,
    navigator.hardwareConcurrency || "", navigator.deviceMemory || "",
    screen.width + "x" + screen.height + "x" + screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone || "", tg?.platform || "",
  ].join("|");
  return sha256(raw);
}

function launchConfetti() {
  const colors = ["#f59e0b", "#fbbf24", "#a855f7", "#22c55e"];
  const wrap = document.getElementById("confettiWrap");
  for (let i = 0; i < 42; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.8 + Math.random() * 1.3) + "s";
    wrap.appendChild(c);
    setTimeout(() => c.remove(), 3400);
  }
}

async function verify() {
  setStatusPill("SCANNING", null);
  document.getElementById("progressFill").style.width = "15%";
  await new Promise(r => setTimeout(r, 500));
  const fingerprint = await buildFingerprint();
  const canvasRaw = buildCanvasFingerprint();
  const canvasFingerprint = canvasRaw ? await sha256(canvasRaw) : "";
  const webglFingerprint = buildWebglFingerprint();

  document.getElementById("progressFill").style.width = "40%";
  await new Promise(r => setTimeout(r, 500));

  document.getElementById("progressFill").style.width = "65%";
  const passed = runChecks();
  await new Promise(r => setTimeout(r, 500));

  document.getElementById("progressFill").style.width = "88%";
  await new Promise(r => setTimeout(r, 450));

  document.getElementById("progressFill").style.width = "100%";
  await new Promise(r => setTimeout(r, 350));

  const res = await fetch("/api/verify", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ telegramId, passed, fingerprint, canvasFingerprint, webglFingerprint, chatId, messageId }),
  });
  const data = await res.json();

  document.getElementById("scanState").style.display = "none";
  const resultState = document.getElementById("resultState");
  resultState.style.display = "block";
  resultState.classList.add("fade");

  if (data.verified) {
    setStatusPill("VERIFIED", "ok");
    resultState.innerHTML = `
      <div class="status-icon ok">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2 class="ok">Verified!</h2>
      <p class="sub">Aap verify ho gaye! Bot me wapas jaake Mini App open karo.</p>
    `;
    launchConfetti();
    setTimeout(() => tg?.close?.(), 2000);
  } else {
    setStatusPill("FAILED", "fail");
    resultState.innerHTML = `
      <div class="status-icon fail">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4"></path>
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <path d="M12 17h.01"></path>
        </svg>
      </div>
      <h2 class="fail">Verification Failed</h2>
      <p class="sub">Suspicious activity detect hui.</p>
      <div class="ban-btn">⛔ Banned — Contact Admin</div>
    `;
  }
}

verify();
</script>
</body>
</html>
